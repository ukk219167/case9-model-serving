# =============================================================================
# ci.yml — Main CI pipeline
# =============================================================================
# Triggers on every push to main and every pull request.
#
# Jobs (run in order):
#   1. lint     — ruff check + ruff format
#   2. test     — pytest with httpx ASGI client (no real model loaded)
#   3. build    — docker buildx, push image to ghcr.io
#   4. deploy   — trigger Hugging Face Space rebuild via API
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   GHCR_TOKEN   — GitHub PAT with packages:write scope (or use GITHUB_TOKEN)
#   HF_TOKEN     — Hugging Face token with write access to the target Space
#   HF_SPACE     — e.g. "your-hf-username/case9-sentiment-api"
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/case9-sentiment-api
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff==0.4.9

      - name: Run ruff linter
        run: ruff check app/ tests/

      - name: Run ruff formatter (check only)
        run: ruff format --check app/ tests/

  # ---------------------------------------------------------------------------
  # Job 2 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint                   # Don't run tests if lint fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      # Cache HuggingFace model weights between runs.
      # Cache key includes the model name so swapping models busts the cache.
      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-distilbert-sst2

      - name: Run tests
        env:
          LOG_FORMAT: pretty        # human-readable in CI logs
          DRIFT_DB_PATH: /tmp/test_drift.db
        run: |
          pytest tests/ \
            --tb=short \
            --asyncio-mode=auto \
            -q

  # ---------------------------------------------------------------------------
  # Job 3 — Build & Push Docker image
  # Only runs on push to main (not on PRs) to avoid wasting registry space.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write              # needed to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided, no manual secret needed

      # Stamp MODEL_VERSION with the short git SHA so every image is traceable.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # CPU torch index so the build doesn't pull the CUDA wheel
          build-args: |
            EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Layer cache stored in the registry — dramatically speeds up rebuilds
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
          # Build args passed into the image for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Job 4 — Deploy to Hugging Face Spaces
  # Triggers a Space rebuild by pushing a commit to the HF repo via the API.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config --global user.email "ci@github-actions"
          git config --global user.name  "GitHub Actions"

          # HF_SPACE is "username/space-name" — extract the username for auth.
          # HF no longer accepts password auth; the token must be in the URL.
          HF_USER=$(echo "${HF_SPACE}" | cut -d'/' -f1)
          HF_REPO_URL="https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"

          # Clone the Space repo with token auth
          git clone "${HF_REPO_URL}" hf_space

          # Sync the full repo root — HF Docker Spaces need Dockerfile at root.
          # Exclude git internals, venv, caches, and the clone dir itself.
          rsync -av \
            --exclude='.git' \
            --exclude='hf_space' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.db' \
            --exclude='*.db-shm' \
            --exclude='*.db-wal' \
            --exclude='.pytest_cache' \
            ./ hf_space/

          cd hf_space
          git add -A
          # Only commit if there are actual changes (idempotent deploys)
          git diff --cached --quiet || git commit -m "deploy: ${{ github.sha }}"
          git push "${HF_REPO_URL}" main
